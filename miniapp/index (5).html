<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>گیفت‌هاب</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/lottie.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#07090f;--card:#111522;--card2:#181d2e;--line:#242a40;--ink:#eef1fb;--mut:#8a91ab;--mint:#5eead4;--mint2:#2dd4bf;--p1:#6366f1;--p2:#a855f7;--o:#fb923c;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 Vazirmatn,Tahoma,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 70px) 14px 110px;background:radial-gradient(circle at 80% -10%,#12343a 0,transparent 45%),var(--bg);min-height:100vh}
header{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:flex;justify-content:space-between;align-items:center;background:rgba(7,9,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:19px;letter-spacing:.5px;color:var(--mint)}.brand small{display:block;font-size:11px;color:var(--mut);font-weight:400;line-height:1}
.pill{background:var(--card);border:1px solid #4a3d1c;color:#fcd34d;border-radius:99px;padding:3px 12px;font-weight:800;font-size:14px}
main{max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--p1),var(--p2) 60%,var(--o));border:0;padding:20px}.hero h2{margin:0;font-size:22px}.hero p{margin:2px 0 0;opacity:.85;font-size:13px}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:10px 0;border-radius:15px}
.seg .on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.tools{display:flex;gap:8px;margin-bottom:12px}
input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:11px 14px;font:inherit;width:100%}
select{width:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g{border-radius:22px;padding:10px;border:1px solid var(--line);text-align:center;position:relative;overflow:hidden}
.g .tag{position:absolute;top:10px;right:10px;background:var(--o);color:#1b1004;font-size:11px;font-weight:800;border-radius:99px;padding:0 10px;z-index:1}
.art{height:104px;display:grid;place-items:center;font-size:56px}.art>*{width:92px;height:92px;object-fit:contain}
.g b{display:block;font-size:14px}.g small{color:var(--mut)}.pr{color:var(--mint);font-weight:800;margin-top:2px}
.btn{width:100%;border:0;border-radius:16px;padding:13px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#5b7cfa,#7c5cf0)}
.btn.mint{background:linear-gradient(135deg,var(--mint),var(--mint2));color:#06312c}.btn.bad{background:none;border:1px solid var(--bad);color:var(--bad)}.btn:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row span{color:var(--mut)}.row b{color:var(--mint)}
.empty{text-align:center;color:var(--mut);padding:36px 0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
nav div{max-width:560px;margin:auto;display:flex;background:rgba(17,21,34,.95);border:1px solid var(--line);border-radius:28px;padding:6px;backdrop-filter:blur(10px)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:600;padding:7px 0;border-radius:22px}
nav button i{display:block;font-style:normal;font-size:21px;line-height:1.2}nav .on{color:var(--mint);background:rgba(94,234,212,.12);box-shadow:inset 0 0 0 1px rgba(94,234,212,.35)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end}#sh.on{display:flex}
#sb{width:100%;max-width:560px;margin:auto;background:var(--card2);border-radius:28px 28px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
#sb .g{margin-bottom:12px;padding:16px}#sb .art{height:130px}#sb .art>*{width:120px;height:120px}

.own{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:12px}
.own .av{width:52px;height:52px;border-radius:50%;background:#12343a;color:var(--mint);display:grid;place-items:center;font-weight:800;font-size:20px;position:relative;overflow:hidden;flex:none}
.own .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.own b{display:block;line-height:1.3}.own small{display:block;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#07090f;padding:8px 18px;border-radius:99px;font-weight:600;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}#toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="brand">گیفت‌هاب<small>GIFT HUB</small></div><div class="pill" id="bal">💎 …</div></header>
<main id="app"></main>
<nav><div id="nav"></div></nav>
<div id="sh"><div id="sb"></div></div>
<div id="toast"></div>
<script>
var tg=window.Telegram&&Telegram.WebApp,tab="gift",sub="store",ME={},MK=[],MINE=[],q="",sort="new",ty="";
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#07090f");tg.setBackgroundColor("#07090f")}catch(e){}}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function f(n){return Number(n||0).toLocaleString("fa-IR")}
function toast(t){var x=$("toast");x.textContent=t;x.className="on";setTimeout(function(){x.className=""},2200)}
function hap(t){try{tg.HapticFeedback.notificationOccurred(t)}catch(e){}}
function num(s){s=String(s||"").replace(/[۰-۹]/g,function(d){return"۰۱۲۳۴۵۶۷۸۹".indexOf(d)}).replace(/[,٬،\s]/g,"").toLowerCase();var m=s.match(/^(\d+(?:\.\d+)?)(k|m|کا|ک|میلیون|میل)?$/);if(!m)return 0;var u={k:1e3,"کا":1e3,"ک":1e3,m:1e6,"میلیون":1e6,"میل":1e6}[m[2]]||1;return Math.round(m[1]*u)}
function api(p,b){return fetch(p,{method:"POST",headers:{"Content-Type":"application/json","X-Init-Data":tg?tg.initData:""},body:JSON.stringify(b||{})}).then(function(r){return r.json()}).catch(function(){return{ok:false,err:"ارتباط با سرور برقرار نشد"}})}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function artEl(c){return'<div class="art" data-c="'+c+'">🎁</div>'}
function loadArt(root){var live=!!(root&&root.id=="sb");(root||document).querySelectorAll(".art[data-c]").forEach(function(el){var c=el.dataset.c;delete el.dataset.c;
 fetch("/api/art/"+c).then(function(r){if(!r.ok)throw 0;var t=r.headers.get("content-type")||"";
  if(t.indexOf("json")>-1)return r.json().then(function(j){el.textContent="";var an=lottie.loadAnimation({container:el,renderer:"svg",loop:true,autoplay:live,animationData:j});if(!live)an.goToAndStop(90,true)});
  return r.blob().then(function(b){var u=URL.createObjectURL(b);el.innerHTML=t.indexOf("video")>-1?'<video src="'+u+'" autoplay loop muted playsinline></video>':'<img src="'+u+'" alt="">'})}).catch(function(){})})}
function card(x,mode){var h=hue(x.type);return'<div class="g" data-id="'+x.id+'" data-m="'+mode+'" style="background:radial-gradient(circle at 50% 30%,hsl('+h+' 45% 28%),hsl('+h+' 35% 12%))">'+(x.price?'<span class="tag">'+(mode=="mk"?"فروش فوری":"برای فروش")+'</span>':"")+artEl(x.code)+'<b>'+esc(x.model)+'</b><small>'+esc(x.type)+' · #'+f(x.tag)+'</small><div class="pr">💎 '+f(x.price||x.value)+'</div></div>'}
function nav(){$("nav").innerHTML=[["acc","👤","حساب کاربری"],["gift","🎁","گیفت"],["bank","🏦","بانک"]].map(function(t){return'<button data-t="'+t[0]+'" class="'+(tab==t[0]?"on":"")+'"><i>'+t[1]+'</i>'+t[2]+'</button>'}).join("")}
function head(){$("bal").textContent="💎 "+f(ME.balance)}
function load(){return api("/api/me").then(function(m){if(m.ok===false){$("app").innerHTML='<div class="empty">'+esc(m.err)+'</div>';return}ME=m;head()})}
function go(){nav();head();var h=$("app");
 if(tab=="acc"){h.innerHTML='<div class="card hero"><h2>'+esc(ME.name||"کاربر")+'</h2><p>'+(ME.username?"@"+esc(ME.username)+" · ":"")+'ID '+ME.id+'</p></div><div class="card"><div class="row"><span>موجودی کیف پول</span><b>💎 '+f(ME.balance)+'</b></div><div class="row"><span>موجودی بانک</span><b>🏦 '+f(ME.bank)+'</b></div><div class="row"><span>تعداد گیفت‌ها</span><b>'+f(ME.gifts)+' از '+f(ME.slots)+'</b></div><div class="row"><span>ارزش کل گیفت‌ها</span><b>💎 '+f(ME.worth)+'</b></div><div class="row"><span>در حال فروش</span><b>'+f(ME.selling)+'</b></div></div>';return}
 if(tab=="bank"){bankView();return}
 var s='<div class="card hero"><h2>گیفت‌ها</h2><p>بخر، بفروش یا قیمت بذار</p></div><div class="seg">'+[["store","فروشگاه"],["mine","گیفت‌های من"],["act","فعالیت"]].map(function(t){return'<button data-s="'+t[0]+'" class="'+(sub==t[0]?"on":"")+'">'+t[1]+'</button>'}).join("")+'</div>';
 if(sub=="store"){var types=[];MK.forEach(function(x){if(types.indexOf(x.type)<0)types.push(x.type)});
  var l=MK.filter(function(x){return(!ty||x.type==ty)&&(x.type+x.model+x.tag).toLowerCase().indexOf(q.toLowerCase())>-1});
  l.sort(function(a,b){return sort=="lo"?a.price-b.price:sort=="hi"?b.price-a.price:b.id-a.id});
  s+='<div class="tools"><input id="q" placeholder="جستجوی گیفت…" value="'+esc(q)+'"><select id="so"><option value="new">جدیدترین</option><option value="lo"'+(sort=="lo"?" selected":"")+'>ارزان‌ترین</option><option value="hi"'+(sort=="hi"?" selected":"")+'>گران‌ترین</option></select></div><div class="tools"><select id="ty"><option value="">همه‌ی کالکشن‌ها</option>'+types.map(function(t){return'<option'+(t==ty?" selected":"")+'>'+esc(t)+'</option>'}).join("")+'</select></div>';
  s+=l.length?'<div class="grid">'+l.map(function(x){return card(x,"mk")}).join("")+'</div>':'<div class="empty">فعلاً گیفتی برای فروش نیست</div>'}
 else if(sub=="mine")s+=MINE.length?'<div class="grid">'+MINE.map(function(x){return card(x,"my")}).join("")+'</div>':'<div class="empty">هنوز گیفتی نداری؛ از بات گیفت باکس بخر 🎁</div>';
 else s+='<div class="card" id="act"><div class="empty">…</div></div>';
 h.innerHTML=s;loadArt(h);
 if(sub=="act")api("/api/activity").then(function(r){var K={list:"ثبت برای فروش",buy:"خرید",sold:"فروش",unlist:"لغو فروش"};$("act").innerHTML=(r.items||[]).length?r.items.map(function(x){return'<div class="row"><span>'+(K[x.kind]||x.kind)+' #'+f(x.gift_id)+'</span><b>💎 '+f(x.price)+'</b></div>'}).join(""):'<div class="empty">هنوز فعالیتی نیست</div>'});
 var qi=$("q");if(qi)qi.oninput=function(){q=qi.value;var p=qi.selectionStart;go();var n=$("q");n.focus();n.setSelectionRange(p,p)};
 if($("so"))$("so").onchange=function(){sort=this.value;go()};if($("ty"))$("ty").onchange=function(){ty=this.value;go()}}
function bankView(){$("app").innerHTML='<div class="empty">…</div>';api("/api/bank").then(function(b){ME.balance=b.balance;head();var h;
 if(!b.acc)h='<div class="card hero"><h2>بانک</h2><p>برای افتتاح حساب '+f(b.fee)+' 💎 لازمه</p></div><div class="card"><button class="btn mint" data-a="open">افتتاح حساب</button></div>';
 else h='<div class="card hero"><p>موجودی بانک</p><h2>🏦 '+f(b.bank)+'</h2><p>شماره حساب: '+esc(b.acc)+'</p></div><div class="card"><div class="row"><span>درصد سود روزانه</span><b>'+(b.rate*100).toLocaleString("fa-IR")+'٪</b></div><div class="row"><span>سود امشب</span><b>💎 '+f(b.daily)+'</b></div></div><div class="card"><input id="amt" inputmode="numeric" placeholder="مبلغ (مثلاً ۵۰۰k یا ۲m)" style="margin-bottom:10px"><div class="grid"><button class="btn mint" data-a="deposit">واریز</button><button class="btn" data-a="withdraw">برداشت</button></div></div><div class="card">'+((b.tx||[]).length?b.tx.map(function(x){return'<div class="row"><span>'+(x.kind=="deposit"?"واریز":x.kind=="withdraw"?"برداشت":esc(x.kind))+'</span><b>'+f(x.amount)+'</b></div>'}).join(""):'<div class="empty">تراکنشی نیست</div>')+'</div>';
 $("app").innerHTML=h})}
function sheet(h){$("sb").innerHTML=h;$("sh").className="on";loadArt($("sb"))}
function shut(){$("sh").className=""}
$("sh").onclick=function(e){if(e.target.id=="sh")shut()};
function refresh(){return Promise.all([load(),api("/api/market"),api("/api/mine")]).then(function(r){MK=r[1].items||[];MINE=r[2].items||[];go()})}
function detail(x,m){var mine=m=="my"||x.mine;
 var rows='<div class="row"><span>کالکشن</span><b>'+esc(x.type)+'</b></div><div class="row"><span>مدل</span><b>'+esc(x.model)+'</b></div><div class="row"><span>آیدی گیفت</span><b>#'+f(x.tag)+'</b></div><div class="row"><span>ارزش بازار</span><b>💎 '+f(x.value)+'</b></div><div class="row"><span>کمیابی</span><b>'+esc(x.rarity)+'</b></div>'+(x.price?'<div class="row"><span>قیمت</span><b>💎 '+f(x.price)+'</b></div>':"")+"";
 var act=!mine?'<button class="btn" data-a="buy" data-id="'+x.id+'" data-p="'+x.price+'">خرید با 💎 '+f(x.price)+'</button>':x.price?'<button class="btn bad" data-a="unlist" data-id="'+x.id+'">لغو فروش</button>':'<input id="pr" inputmode="numeric" placeholder="قیمت فروش (مثلاً ۱۲m)" style="margin-bottom:10px"><button class="btn mint" data-a="list" data-id="'+x.id+'">ثبت برای فروش</button>';
 var h=hue(x.type);sheet('<div class="g" style="background:radial-gradient(circle at 50% 30%,hsl('+h+' 45% 28%),hsl('+h+' 35% 12%))">'+artEl(x.code)+'<b style="font-size:18px">'+esc(x.model)+'</b><small>'+esc(x.type)+' · #'+f(x.tag)+'</small></div><div class="card" style="padding:4px 14px">'+rows+'</div><div id="own"></div>'+act);ownerCard(x.owner_id)}
function ownerCard(i){api("/api/owner",{id:i}).then(function(o){var el=$("own");if(!el||!o.ok)return;var nm=o.name||(o.user?"@"+o.user:"کاربر");el.innerHTML='<div class="own" data-u="'+esc(o.user)+'"><div class="av">'+esc(nm.charAt(0))+'<img src="/api/avatar/'+o.id+'" onerror="this.remove()" alt=""></div><div><small>مالک گیفت</small><b>'+esc(nm)+'</b><small dir="ltr">'+(o.user?"@"+esc(o.user)+" · ":"")+'ID '+o.id+'</small></div></div>'})}
document.addEventListener("click",function(e){var el=e.target.closest("[data-t],[data-s],[data-a],.g[data-id],.own[data-u]");if(!el)return;var d=el.dataset;
 if(el.className=="own"){if(d.u&&tg)tg.openTelegramLink("https://t.me/"+d.u);return}
 if(d.t){tab=d.t;go();window.scrollTo(0,0);return}
 if(d.s){sub=d.s;go();return}
 if(!d.a&&d.id){var id=+d.id,x=(d.m=="mk"?MK:MINE).filter(function(z){return z.id==id})[0];if(x)detail(x,d.m);return}
 var a=d.a,btn=el;
 if(a=="open"||a=="deposit"||a=="withdraw"){btn.disabled=true;var p=a=="open"?api("/api/bank/open"):(function(){var n=num($("amt").value);if(!n){toast("مبلغ معتبر وارد کن");btn.disabled=false;return null}return api("/api/bank/move",{kind:a,amount:n})})();if(!p)return;
  p.then(function(r){btn.disabled=false;if(r.ok){hap("success");toast("انجام شد ✅");load().then(bankView)}else{hap("error");toast(r.err||"خطا")}});return}
 var body={id:+d.id};
 if(a=="list"){body.price=num($("pr").value);if(!body.price){toast("قیمت معتبر وارد کن");return}}
 if(a=="buy")body.price=+d.p;
 btn.disabled=true;
 api("/api/"+a,body).then(function(r){btn.disabled=false;if(r.ok){hap("success");shut();toast(a=="buy"?"خرید انجام شد 🎉":a=="list"?"برای فروش ثبت شد":"فروش لغو شد");refresh()}else{hap("error");toast(r.err||"خطا")}})});
refresh();
</script>
</body>
</html>
